name: T-012 E1 slices and one-vs-multi groups

on:
  push:
    branches:
      - codex/T-012-error-analysis
    paths:
      - ".github/workflows/t012-e1-error-slices.yml"
      - "scripts/t012_widerface_error_slices.py"
      - "tests/test_t012_widerface_error_slices.py"
      - "scripts/t012_widerface_one_multi.py"
      - "tests/test_t012_widerface_one_multi.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slices:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: yunet
            expected_tp: 28922
            expected_rows: 1195480
            expected_dropped: 182
            expected_clipped: 56316
          - candidate: blazeface
            expected_tp: 7063
            expected_rows: 477622
            expected_dropped: 3191
            expected_clipped: 14206
          - candidate: scrfd
            expected_tp: 24804
            expected_rows: 4858820
            expected_dropped: 595274
            expected_clipped: 534287
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check slice logic on synthetic boxes
        run: python -m unittest discover -s tests -p test_t012_widerface_error_slices.py -v
      - name: Check one-vs-multi group scoring on synthetic boxes
        run: python -m unittest discover -s tests -p test_t012_widerface_one_multi.py -v
      - name: Install pinned YuNet runtime
        if: matrix.candidate == 'yunet'
        run: python -m pip install numpy==2.2.6 opencv-contrib-python==5.0.0.93
      - name: Install pinned BlazeFace runtime
        if: matrix.candidate == 'blazeface'
        run: python -m pip install numpy==2.2.6 mediapipe==1.0.0
      - name: Install pinned SCRFD runtime
        if: matrix.candidate == 'scrfd'
        run: python -m pip install numpy==2.2.6 insightface==0.7.3 onnxruntime==1.20.1
      - name: Download pinned WIDER inputs to temporary runner storage
        run: |
          mkdir -p "${RUNNER_TEMP}/t012-e1"
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://huggingface.co/datasets/CUHK-CSE/wider_face/resolve/main/data/WIDER_val.zip" \
            --output "${RUNNER_TEMP}/t012-e1/WIDER_val.zip"
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://huggingface.co/datasets/CUHK-CSE/wider_face/resolve/main/data/wider_face_split.zip" \
            --output "${RUNNER_TEMP}/t012-e1/wider_face_split.zip"
      - name: Download pinned YuNet weight
        if: matrix.candidate == 'yunet'
        run: |
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://github.com/opencv/opencv_zoo/raw/refs/heads/main/models/face_detection_yunet/face_detection_yunet_2026may.onnx" \
            --output "${RUNNER_TEMP}/t012-e1/model.onnx"
      - name: Download pinned BlazeFace weight
        if: matrix.candidate == 'blazeface'
        run: |
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_full_range/float16/latest/blaze_face_full_range.tflite" \
            --output "${RUNNER_TEMP}/t012-e1/model.tflite"
      - name: Download and extract pinned SCRFD detector
        if: matrix.candidate == 'scrfd'
        run: |
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://github.com/deepinsight/insightface/releases/download/model-zoo/buffalo_sc.zip" \
            --output "${RUNNER_TEMP}/t012-e1/buffalo_sc.zip"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from zipfile import ZipFile

          root = Path(os.environ["RUNNER_TEMP"]) / "t012-e1"
          archive = root / "buffalo_sc.zip"
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == "57d31b56b6ffa911c8a73cfc1707c73cab76efe7f13b675a05223bf42de47c72"
          with ZipFile(archive) as source:
              matches = [name for name in source.namelist() if Path(name).name == "det_500m.onnx"]
              assert len(matches) == 1
              content = source.read(matches[0])
          assert hashlib.sha256(content).hexdigest() == "5e4447f50245bbd7966bd6c0fa52938c61474a04ec7def48753668a9d8b4ea3a"
          (root / "det_500m.onnx").write_bytes(content)
          print("Pinned SCRFD detector extracted and hashed")
          PY
      - name: Validate original GT/image manifest
        run: |
          python scripts/t011_widerface_evaluate.py \
            --images "${RUNNER_TEMP}/t012-e1/WIDER_val.zip" \
            --annotations "${RUNNER_TEMP}/t012-e1/wider_face_split.zip" \
            --preflight-only
      - name: Recreate pinned predictions outside Git
        run: |
          case "${{ matrix.candidate }}" in
            yunet)
              MODEL_PATH="${RUNNER_TEMP}/t012-e1/model.onnx"
              export OPENCV_FORCE_DNN_ENGINE=4
              ;;
            blazeface) MODEL_PATH="${RUNNER_TEMP}/t012-e1/model.tflite" ;;
            scrfd) MODEL_PATH="${RUNNER_TEMP}/t012-e1/det_500m.onnx" ;;
          esac
          python scripts/t011_widerface_predict.py \
            --candidate "${{ matrix.candidate }}" \
            --model "${MODEL_PATH}" \
            --images "${RUNNER_TEMP}/t012-e1/WIDER_val.zip" \
            --annotations "${RUNNER_TEMP}/t012-e1/wider_face_split.zip" \
            --output "${RUNNER_TEMP}/t012-e1/predictions.json"
      - name: Re-evaluate original T-011 AP and print aggregate
        run: |
          python scripts/t011_widerface_evaluate.py \
            --images "${RUNNER_TEMP}/t012-e1/WIDER_val.zip" \
            --annotations "${RUNNER_TEMP}/t012-e1/wider_face_split.zip" \
            --predictions "${RUNNER_TEMP}/t012-e1/predictions.json" \
            --output "${RUNNER_TEMP}/t012-e1/e1-summary.json"
      - name: Replay T-011 matching and print aggregate slices
        run: |
          python scripts/t012_widerface_error_slices.py \
            --images "${RUNNER_TEMP}/t012-e1/WIDER_val.zip" \
            --annotations "${RUNNER_TEMP}/t012-e1/wider_face_split.zip" \
            --predictions "${RUNNER_TEMP}/t012-e1/predictions.json" \
            --output "${RUNNER_TEMP}/t012-e1/summary.json" \
            --expected-tp "${{ matrix.expected_tp }}" \
            --expected-rows "${{ matrix.expected_rows }}" \
            --expected-dropped "${{ matrix.expected_dropped }}" \
            --expected-clipped "${{ matrix.expected_clipped }}"
      - name: Score one-vs-multi-valid-GT image groups
        run: |
          python scripts/t012_widerface_one_multi.py \
            --images "${RUNNER_TEMP}/t012-e1/WIDER_val.zip" \
            --annotations "${RUNNER_TEMP}/t012-e1/wider_face_split.zip" \
            --predictions "${RUNNER_TEMP}/t012-e1/predictions.json" \
            --e1-summary "${RUNNER_TEMP}/t012-e1/e1-summary.json" \
            --output "${RUNNER_TEMP}/t012-e1/one-multi-summary.json"
      - name: Remove temporary predictions and summary
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/t012-e1/predictions.json"
          rm -f "${RUNNER_TEMP}/t012-e1/e1-summary.json"
          rm -f "${RUNNER_TEMP}/t012-e1/summary.json"
          rm -f "${RUNNER_TEMP}/t012-e1/one-multi-summary.json"
