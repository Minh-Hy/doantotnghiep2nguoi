name: T-011 E1 YuNet full validation

on:
  push:
    branches:
      - codex/T-011-exploratory-baseline
    paths:
      - ".github/workflows/t011-e1-yunet-full.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yunet-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENCV_FORCE_DNN_ENGINE: "4"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned YuNet runtime
        run: python -m pip install numpy==2.2.6 opencv-contrib-python==5.0.0.93
      - name: Download pinned inputs to temporary runner storage
        run: |
          mkdir -p "${RUNNER_TEMP}/t011-e1"
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://huggingface.co/datasets/CUHK-CSE/wider_face/resolve/main/data/WIDER_val.zip" \
            --output "${RUNNER_TEMP}/t011-e1/WIDER_val.zip"
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://huggingface.co/datasets/CUHK-CSE/wider_face/resolve/main/data/wider_face_split.zip" \
            --output "${RUNNER_TEMP}/t011-e1/wider_face_split.zip"
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://github.com/opencv/opencv_zoo/raw/refs/heads/main/models/face_detection_yunet/face_detection_yunet_2026may.onnx" \
            --output "${RUNNER_TEMP}/t011-e1/face_detection_yunet_2026may.onnx"
      - name: Validate GT and image manifest
        run: |
          python scripts/t011_widerface_evaluate.py \
            --images "${RUNNER_TEMP}/t011-e1/WIDER_val.zip" \
            --annotations "${RUNNER_TEMP}/t011-e1/wider_face_split.zip" \
            --preflight-only
      - name: Produce full YuNet predictions outside Git
        run: |
          python scripts/t011_widerface_predict.py \
            --candidate yunet \
            --model "${RUNNER_TEMP}/t011-e1/face_detection_yunet_2026may.onnx" \
            --images "${RUNNER_TEMP}/t011-e1/WIDER_val.zip" \
            --annotations "${RUNNER_TEMP}/t011-e1/wider_face_split.zip" \
            --output "${RUNNER_TEMP}/t011-e1/yunet-predictions.json"
      - name: Evaluate project AP and print aggregate only
        run: |
          python scripts/t011_widerface_evaluate.py \
            --images "${RUNNER_TEMP}/t011-e1/WIDER_val.zip" \
            --annotations "${RUNNER_TEMP}/t011-e1/wider_face_split.zip" \
            --predictions "${RUNNER_TEMP}/t011-e1/yunet-predictions.json" \
            --output "${RUNNER_TEMP}/t011-e1/yunet-summary.json"
      - name: Remove temporary prediction and summary
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/t011-e1/yunet-predictions.json"
          rm -f "${RUNNER_TEMP}/t011-e1/yunet-summary.json"
