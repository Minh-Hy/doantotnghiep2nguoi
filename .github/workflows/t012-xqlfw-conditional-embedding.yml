name: T-012 X-012-I conditional embedding

on:
  push:
    branches:
      - codex/T-012-error-analysis
    paths:
      - ".github/workflows/t012-xqlfw-conditional-embedding.yml"
      - "scripts/t012_xqlfw_conditional_embedding.py"
      - "docs/03-baseline/T-012-X-012-I-conditional-embedding-protocol.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conditional-embedding:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned B0 runtime
        run: python -m pip install numpy==2.2.6 opencv-contrib-python==5.0.0.93 insightface==0.7.3 onnxruntime==1.20.1 scikit-learn==1.7.1
      - name: Check research script
        run: python -m py_compile scripts/t012_xqlfw_conditional_embedding.py
      - name: Download pinned public inputs to temporary storage
        run: |
          mkdir -p "${RUNNER_TEMP}/t012-x012i"
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://github.com/Martlgap/xqlfw/releases/download/1.0/xqlfw.zip" \
            --output "${RUNNER_TEMP}/t012-x012i/xqlfw.zip"
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://github.com/Martlgap/xqlfw/releases/download/1.0/xqlfw_pairs.txt" \
            --output "${RUNNER_TEMP}/t012-x012i/xqlfw_pairs.txt"
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://github.com/deepinsight/insightface/releases/download/model-zoo/buffalo_sc.zip" \
            --output "${RUNNER_TEMP}/t012-x012i/buffalo_sc.zip"
      - name: Compare B0 against detection-first A0
        run: |
          python scripts/t012_xqlfw_conditional_embedding.py \
            --images "${RUNNER_TEMP}/t012-x012i/xqlfw.zip" \
            --pairs "${RUNNER_TEMP}/t012-x012i/xqlfw_pairs.txt" \
            --model "${RUNNER_TEMP}/t012-x012i/buffalo_sc.zip" \
            --cache "${RUNNER_TEMP}/t012-x012i/cache" \
            --output "${RUNNER_TEMP}/t012-x012i/summary.json"
      - name: Remove temporary biometric data, embeddings and weights
        if: always()
        run: rm -rf "${RUNNER_TEMP}/t012-x012i"
